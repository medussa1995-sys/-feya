name: Update Feya Q80

on:
  schedule:
    # Ежедневно в 03:17 UTC
    - cron: "17 3 * * *"

  # Позволяет запустить обновление вручную из вкладки Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feya:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update Feya Q80
        run: |
          python scripts/update_feya.py

      - name: Commit updated data
        run: |
          git config user.name "feya-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add thresholds.json data/

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🧚 Update Feya Q80"
            git push
          fi
